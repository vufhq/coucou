# /etc/wsl.conf for agent-01. The agent's computer sees none of Windows:
# no drives mounted, no Windows programs, no Windows PATH.

[boot]
systemd=true

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=agent

# WSL would link /etc/resolv.conf into /mnt/wsl, which the worker and the
# runner cannot see; mount-computer.sh writes it instead, at every boot.
[network]
generateResolvConf=false
