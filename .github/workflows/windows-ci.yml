name: Windows CI

# Type-checks and tests the Windows app on every pull request that touches it.
# Nothing is packed and nothing is published: releases stay in windows.yml,
# which only runs on tags.

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-ci-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-ci-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      - name: Rust tests
        run: cargo test --workspace --locked
